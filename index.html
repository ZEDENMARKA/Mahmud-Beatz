<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Arka Planlı Site</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .arka-plan {
      background-image: url('https://images.pexels.com/photos/45189/pexels-photo-45189.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
      background-size: cover;
      background-position: center;
      filter: blur(4px);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .icerik {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #3498db;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #ff0000;
      transform: translateY(-5px);
    }

    .btn:active {
      background-color: #ff0000;
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="arka-plan"></div>

  <div class="icerik">
    <h1>机密信息</h1>
    <button class="btn" onclick="window.location.href='https://www.youtube.com/@mahmudbeatz';">
      Mahmud Beatz
    </button>
  </div>

</body>
</html>
